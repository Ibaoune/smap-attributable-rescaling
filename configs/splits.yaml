# Spatio-Temporal Data Splitting Protocol for SAR
# Reproduit rigoureusement le protocole établi dans smap-xai-audit

temporal:
  # Entraînement et réglage
  train:
    start_date: "2016-01-08"
    end_date: "2018-12-31"
  validation:
    start_date: "2019-01-01"
    end_date: "2019-12-31"
  # Test final indépendant scellé
  test:
    start_date: "2020-01-01"
    end_date: "2020-12-31"

pretest_temporal_cv:
  fold_1:
    train: ["2016-01-08", "2016-12-31"]
    validation: ["2017-01-01", "2017-12-31"]
  fold_2:
    train: ["2016-01-08", "2017-12-31"]
    validation: ["2018-01-01", "2018-12-31"]
  fold_3:
    train: ["2016-01-08", "2018-12-31"]
    validation: ["2019-01-01", "2019-12-31"]

spatial:
  block_size_degrees: 1.0
  n_folds: 5
  assignment_method: "deterministic balanced assignment based on geometric support block weight"
  anchor: "integer-degree geographic boundaries (floor(lat), floor(lon))"

rules:
  random_pixel_day_split: forbidden
  target_based_assignment: forbidden
  test_used_for_tuning: false
  untouched_test_rule: "The 2020 test set remains completely untouched during all exploratory analysis, feature selection, and hyperparameter tuning."
  final_refit_rule: "After model architecture and hyperparameters are frozen, refit final model on full 2016-2019 training window, then evaluate ONCE on 2020 test set."
